name: Profile metrics

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:            # run manually from the Actions tab

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # A classic PAT with `repo` + `read:user` scope, stored as the METRICS_TOKEN
          # secret, unlocks private-contribution stats. Without it, the built-in
          # GITHUB_TOKEN still works for everything public.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: MehemudAzad
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
          config_order: base.header, base.activity, isocalendar, languages, habits, achievements, base.community, base.repositories

          # isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: >-
            html, css, jupyter-notebook, tex, makefile, shell, dockerfile

          # coding habits / active hours
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # GitHub achievement badges (Quickdraw, Pull Shark, YOLO, ...)
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
